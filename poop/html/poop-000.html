<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 請修改為此頁面的標題 -->
    <title>網站名稱｜頁面標題</title>
    <link rel="icon" href="../images/mark.png" type="image/x-icon">
    <link rel="stylesheet" href="/poop/css/poop-000.css">
</head>
<body>
    <!-- 側欄收合控制：保留 id 與 for 的對應關係 -->
    <input type="checkbox" id="menu-toggle" class="menu-checkbox">

    <nav class="sidebar" aria-label="主要選單">
        <label for="menu-toggle" class="toggle-btn" aria-label="開啟或收合選單">
            <img src="/images/menu-burger.png" alt="" class="nav-icon">
        </label>

        <ul>
            <!-- 複製或刪除 li，以調整所有頁面共用的選單 -->
            <li><a href="/index.html"><img src="/images/home.png" alt="" class="nav-icon"><span>首頁</span></a></li>
            <li><a href="/html/item.html"><img src="/images/document.png" alt="" class="nav-icon"><span>我的東西</span></a></li>
            <li><a href="/html/link.html"><img src="/images/clip.png" alt="" class="nav-icon"><span>朋友們</span></a></li>
        </ul>
    </nav>

    <main class="content">
        <article class="main-card">
            <!-- 修改頁面主標題與說明 -->
            <header class="banner">
                <h1>頁面標題</h1>
                <p>用一句話介紹這個頁面的內容。</p>
            </header>

            <div class="page-body">
                <!-- 一般文字區塊：不需要時可直接刪除 -->
                

                <!-- 卡片區塊：複製 article.info-card 即可新增一張卡片 -->
                <section class="content-section">
                    
                    <div class="card-grid">
                    <a href="/poop/poop.html">
                        <article class="info-card skill-hover">
                            <h3>回到惡臭之地</h3>
                        </article></a>
                    <a >
                        <article class="info-card skill-hover">
                            <h3>上一個馬桶=0</h3>
                        </article></a>
                          <section class="content-section">
                    <a >
                        <article class="info-card skill-hover">
                            <h3>下一個馬桶=0</h3>
                        </article></a>
                    </div>
                </section>
                

                <!-- 需要連結卡片時，將整張卡片包在 a.card-link 裡 -->
                <!--
                <a class="card-link" href="https://example.com" target="_blank" rel="noopener noreferrer">
                    <article class="info-card skill-hover">...</article>
                </a>
                -->
            </div>
            <section class="content-section">
                    <h2 class="section-title">便便教</h2>
                    <p>某次拉屎發現便便是綠色的</p>
                </section>
        </article>
    </main>
