<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>頁面標題｜網站名稱</title>
    <link rel="icon" href="/images/mark.png" type="image/x-icon">
    <link rel="stylesheet" href="/css/manga-mono.css">
    <link rel="stylesheet" href="/css/PageTemplate.css">
</head>
<body>
    <input type="checkbox" id="menu-toggle" class="menu-checkbox">

    <nav class="sidebar" aria-label="主要選單">
        <label for="menu-toggle" class="toggle-btn" aria-label="開啟或收合選單">
            <img src="/images/menu-burger.png" alt="" class="nav-icon">
        </label>

        <ul>
            <li><a href="/html/Main.html"><img src="/images/home.png" alt="" class="nav-icon"><span>首頁</span></a></li>
            <li><a href="/html/item.html"><img src="/images/document.png" alt="" class="nav-icon"><span>我的東西</span></a></li>
            <li><a href="/html/link.html"><img src="/images/clip.png" alt="" class="nav-icon"><span>朋友們</span></a></li>
        </ul>
    </nav>

    <main class="content">
        <article class="main-card">
            <header class="banner">
                <h1>頁面標題</h1>
                <p>這裡寫一段簡短介紹，說明這頁是做什麼的。</p>
            </header>

            <div class="page-body">
                <section class="content-section">
                    <h2 class="section-title">區塊標題</h2>
                    <p>這裡是正文內容區。你可以直接替換成自己的介紹、說明或文章內容。</p>
                </section>

                <section class="content-section">
                    <h2 class="section-title">卡片區塊</h2>
                    <p class="info-chip">範例標籤</p>

                    <div class="card-grid">
                        <article class="info-card skill-hover">
                            <img src="/images/code-simple.png" alt="卡片圖示" class="target-icon">
                            <h3>卡片標題 1</h3>
                            <p>這裡放簡短說明。</p>
                        </article>

                        <article class="info-card skill-hover">
                            <img src="/images/document.png" alt="卡片圖示" class="target-icon">
                            <h3>卡片標題 2</h3>
                            <p>這裡放簡短說明。</p>
                        </article>

                        <article class="info-card skill-hover">
                            <img src="/images/clip.png" alt="卡片圖示" class="target-icon">
                            <h3>卡片標題 3</h3>
                            <p>這裡放簡短說明。</p>
                        </article>
                    </div>
                </section>

                <section class="content-section">
                    <h2 class="section-title">可複製區塊</h2>
                    <p>如果要新增新段落，直接複製整個 section 區塊即可。</p>
                </section>

                <!-- 範例：連結卡片
                <a class="card-link" href="https://example.com" target="_blank" rel="noopener noreferrer">
                    <article class="info-card skill-hover">
                        <img src="/images/mark.png" alt="連結圖示" class="target-icon">
                        <h3>外部連結</h3>
                        <p>點擊前往指定網址。</p>
                    </article>
                </a>
                -->
            </div>
        </article>
    </main>
</body>
</html>
