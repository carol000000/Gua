<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/css/comics.css">


</head>

<body>

    <input type="checkbox" id="menu-toggle" class="menu-checkbox">

    <nav class="sidebar">
        <label for="menu-toggle" class="toggle-btn">
            <img src="/images/menu-burger.png" alt="Toggle" class="nav-icon">
        </label>

        <ul>
            <li>
                <a href="/index.html">
                    <img src="/images/home.png" alt="Home" class="nav-icon">
                    <span>首頁</span>
                </a>
            </li>
            <li>
                <a href="/html/item.html">
                    <img src="/images/document.png" alt="Items" class="nav-icon">
                    <span>我的東西</span>
                </a>
            </li>
            <li>
                <a href="/html/game.html">
                    <img src="/images/gamepad.png" alt="Games" class="nav-icon">
                    <span>小遊戲</span>
                </a>
            </li>
            <li>
                <a href="/html/parpar.html">
                    <img src="/images/pencil.png" alt="Posts" class="nav-icon">
                    <span>文章</span>
                </a>
            </li>
            <li>
                <a href="/html/link.html">
                    <img src="/images/clip.png" alt="Links" class="nav-icon">
                    <span>朋友們</span>
                </a>
            </li>
        </ul>
    </nav>
    <div class="content">
        <article class="main-card">
            <header class="banner">
                <h1>圖片或漫畫</h1>
            </header>
            <section class="section-title">
                <br>
                <section class="section-title">

                    <div class="book-container">
                        <div class="book-page" id="comicPageContainer">
                        </div>
                    </div>

                    <div class="comic-control-bar">

                        <div class="action-buttons">
                            <button class="book-btn" id="prevBtn">
                                <span class="btn-icon">&#10094;</span> 上一頁
                            </button>
                            <button class="book-btn" id="nextBtn">
                                下一頁 <span class="btn-icon">&#10148;</span>
                            </button>
                        </div>

                        <div class="page-number" id="pageNumber">第 1 / 1 頁</div>

                        <div class="menu-wrapper">
                            <select id="comicSelect" class="comic-dropdown">
                            </select>
                        </div>

                    </div>
                </section>

                <script>
                    const comicDatabase = [
                        {
                            title: "插圖",
                            images: [
                                "/images/a001.png",
                                "/images/a002.png",
                                "/images/a003.png",
                                "/images/a004.png",
                                "/images/a005.png",
                                "/images/a006.png",
                                "/images/a007.png",
                                "/images/a008.png",
                                "/images/a009.jpg",
                                "/images/a010.png",
                                "/images/a011.png",
                                "/images/a012.png",
                                "/images/a013.png",
                                "/images/a014.png",
                                "/images/a015.png",
                                "/images/a016.png",
                                "/images/mark.png"
                            ]
                        },
                        {
                            title: "國中畫的漫畫-1",
                            images: [
                                "/comics/100.jpg",
                                "/comics/101.jpg",
                                "/comics/102.jpg",
                                "/comics/103.jpg",
                                "/comics/104.jpg",
                                "/comics/105.jpg",
                                "/comics/106.jpg",
                                "/comics/107.jpg",
                                "/comics/108.jpg",
                                "/comics/109.jpg",
                                "/comics/110.jpg",
                                "/comics/111.jpg",
                                "/comics/112.jpg",
                                "/comics/113.jpg"

                            ]
                        },
                        {
                            title: "國中畫的漫畫-2",
                            images: [
                                "/comics/200.jpg",
                                "/comics/201.jpg",
                                "/comics/202.jpg",
                                "/comics/203.jpg",
                                "/comics/204.jpg",
                                "/comics/205.jpg",
                                "/comics/206.jpg",
                                "/comics/207.jpg",
                                "/comics/208.jpg",
                                "/comics/209.jpg",
                                "/comics/210.jpg",
                                "/comics/211.jpg",
                                "/comics/212.jpg",
                                "/comics/213.jpg"

                            ]
                        },
                {
                            title: "國中畫的漫畫-3",
                            images: [
                                "/comics/300.jpg",
                                "/comics/301.jpg",
                                "/comics/302.jpg",
                                "/comics/303.jpg",
                                "/comics/304.jpg",
                                "/comics/305.jpg",
                                "/comics/306.jpg",
                                "/comics/307.jpg",
                                "/comics/308.jpg",
                                "/comics/309.jpg",
                                "/comics/310.jpg",
                                "/comics/311.jpg",
                                "/comics/312.jpg",
                                "/comics/313.jpg"

                            ]
                        },
                {
                            title: "國中畫的漫畫-4",
                            images: [
                                "/comics/400.jpg",
                                "/comics/401.jpg",
                                "/comics/402.jpg",
                                "/comics/403.jpg",
                                "/comics/404.jpg",
                                "/comics/405.jpg",
                                "/comics/406.jpg",
                                "/comics/407.jpg",
                                "/comics/408.jpg",
                                "/comics/409.jpg",
                                "/comics/410.jpg",
                                "/comics/411.jpg",
                                "/comics/412.jpg",
                                "/comics/413.jpg"

                            ]
                        },
                {
                            title: "國中畫的漫畫-5",
                            images: [
                                "/comics/500.jpg",
                                "/comics/501.jpg",
                                "/comics/502.jpg",
                                "/comics/503.jpg",
                                "/comics/504.jpg",
                                "/comics/505.jpg",
                                "/comics/506.jpg",
                                "/comics/507.jpg",
                                "/comics/508.jpg",
                                "/comics/509.jpg"
                            ]
                        },
                    ];

                    const comicSelect = document.getElementById('comicSelect');
                    const container = document.getElementById('comicPageContainer');
                    const prevBtn = document.getElementById('prevBtn');
                    const nextBtn = document.getElementById('nextBtn');
                    const pageNumber = document.getElementById('pageNumber');

                    let currentComicIndex = 0;
                    let currentImageIndex = 0;

                    comicDatabase.forEach((comic, index) => {
                        const option = document.createElement('option');
                        option.value = index;
                        option.textContent = comic.title;
                        comicSelect.appendChild(option);
                    });

                    function renderComic() {
                        container.innerHTML = '';
                        const currentImages = comicDatabase[currentComicIndex].images;

                        currentImages.forEach((src, index) => {
                            const img = document.createElement('img');
                            img.src = src;
                            img.alt = `第 ${index + 1} 頁`;
                            img.classList.add('comic-img');
                            img.style.display = (index === 0) ? 'block' : 'none';
                            container.appendChild(img);
                        });

                        currentImageIndex = 0;
                        updatePageUI();
                    }

                    function updatePageUI() {
                        const images = container.querySelectorAll('.comic-img');
                        images.forEach((img, index) => {
                            img.style.display = (index === currentImageIndex) ? 'block' : 'none';
                        });
                        pageNumber.textContent = `第 ${currentImageIndex + 1} / ${images.length} 頁`;

                        // 額外小優化：第一頁時讓「上一頁」變淡，最後一頁時讓「下一頁」變淡
                        prevBtn.style.opacity = (currentImageIndex === 0) ? '0.5' : '1';
                        nextBtn.style.opacity = (currentImageIndex === images.length - 1) ? '0.5' : '1';
                    }

                    comicSelect.addEventListener('change', (e) => {
                        currentComicIndex = e.target.value;
                        renderComic();
                    });

                    nextBtn.addEventListener('click', () => {
                        const images = container.querySelectorAll('.comic-img');
                        if (currentImageIndex < images.length - 1) {
                            currentImageIndex++;
                            updatePageUI();
                        }
                    });

                    prevBtn.addEventListener('click', () => {
                        if (currentImageIndex > 0) {
                            currentImageIndex--;
                            updatePageUI();
                        }
                    });

                    renderComic();
                </script>

            </section>
</body>

</html>
